services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  n8n:
    image: n8nio/n8n:2.15.1
    container_name: n8n_local       # Wymuszamy roota w formacie UID:GID
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_RUNNERS_ENABLED=true
      # internal: n8n sam odpala runner JS we wlasnym procesie (bez osobnego
      # kontenera/brokera). external timeoutowal node'y Code po 60s -> workflow padal.
      - N8N_RUNNERS_MODE=internal
      - N8N_BLOCK_FS_WRITE_ACCESS=false
      - N8N_AI_ENABLED=true
      - N8N_ENCRYPTION_KEY=2026n8n
    volumes:
      - ./n8n_config:/home/node/.n8n
      - .:/home/node/data

  task-runners:
    build:
      context: .
      dockerfile: Dockerfile.runners # Wskazujemy nowy Dockerfile
    container_name: n8n_runners
    restart: always
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n_local:5679
      - N8N_RUNNERS_AUTH_TOKEN=2026k
      # TA LINIA JEST KLUCZOWA:
      - N8N_RUNNERS_CONFIG_FILE=/etc/n8n-task-runners.json
    volumes:
      - ./data:/home/node/csv_data
      - ./metabase-data:/home/node/db_data
    depends_on:
      - n8n


  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: always
    user: root
    ports:
      - "3000:3000"
    volumes:
      - ./metabase-data:/metabase-data
      - ./plugins:/plugins
      - ./uploads:/mb-uploads:ro
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_PLUGINS_DIR=/plugins
      - MB_DB_TYPE=h2
      - JAVA_OPTS=-Xms256m -Xmx1g

  streamlit:
    image: python:3.11-slim
    container_name: streamlit_app
    restart: always
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app:/app
    command: >
      sh -c "pip install -q streamlit requests pandas &&
             streamlit run app.py
             --server.port=8501
             --server.address=0.0.0.0
             --server.headless=true"
    depends_on:
      - n8n

    
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - fastapi_backend

  postgres:
    image: postgres:16-alpine
    container_name: postgres_analytics
    restart: always
    environment:
      - POSTGRES_DB=analytics
      - POSTGRES_USER=analyst
      - POSTGRES_PASSWORD=analyst
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  fastapi_backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - METABASE_URL=http://metabase:3000
      - METABASE_PUBLIC_URL=${METABASE_PUBLIC_URL:-http://localhost:3000}
      - METABASE_USER=${METABASE_USER}
      - METABASE_PASSWORD=${METABASE_PASSWORD}
      - PG_HOST=postgres
      - PG_DB=analytics
      - PG_USER=analyst
      - PG_PASS=analyst
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - OLLAMA_SQL_MODEL=qwen2.5-coder:7b
    depends_on:
      - n8n
      - postgres
volumes:
  ollama_data:
  postgres_data:
